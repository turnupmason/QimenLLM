[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qimenllm"
version = "0.1.0"
description = "Source-grounded Qimen research and product foundation; no chart algorithms yet"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
qimenllm = "qimenllm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qimenllm = ["knowledge/migrations/*.sql"]
